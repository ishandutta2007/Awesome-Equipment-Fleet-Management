<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 38px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #fbbf24; letter-spacing: 0.5px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.05); }
    }
    @keyframes moveGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    @keyframes dashSignal {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .bg-grid { stroke: #334155; stroke-width: 1; opacity: 0.15; }
    .pulse-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .signal-path { stroke-dasharray: 20, 10; animation: dashSignal 25s linear infinite; }
    .radar-line { transform-origin: 1060px 180px; animation: radarSweep 8s linear infinite; }
    .floating-card { animation: floatPill 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Geometric Ambient Elements (BACKGROUND LAYER) -->
  <circle cx="200" cy="180" r="180" fill="#3b82f6" class="pulse-circle" filter="url(#glowBlue)"/>
  <circle cx="1000" cy="180" r="150" fill="#d97706" class="pulse-circle" filter="url(#glowGold)"/>

  <!-- Grid Pattern -->
  <g class="bg-grid">
    <path d="M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280 M 0 320 L 1200 320" />
    <path d="M 100 0 L 100 360 M 200 0 L 200 360 M 300 0 L 300 360 M 400 0 L 400 360 M 500 0 L 500 360 M 600 0 L 600 360 M 700 0 L 700 360 M 800 0 L 800 360 M 900 0 L 900 360 M 1000 0 L 1000 360 M 1100 0 L 1100 360" />
  </g>

  <!-- Telematics & Fleet Animated Signal Lines (Background Layer) -->
  <path d="M -50 280 Q 300 340 600 280 T 1250 220" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.4" class="signal-path"/>
  <path d="M -50 100 Q 400 30 800 120 T 1250 60" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.35" class="signal-path"/>

  <!-- Decorative Construction Equipment Radar HUD (Right Side - Behind text margin) -->
  <g transform="translate(940, 70)">
    <circle cx="110" cy="110" r="90" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="110" cy="110" r="60" fill="none" stroke="#64748b" stroke-width="1"/>
    <circle cx="110" cy="110" r="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="110" y1="20" x2="110" y2="200" stroke="#475569" stroke-width="1"/>
    <line x1="20" y1="110" x2="200" y2="110" stroke="#475569" stroke-width="1"/>
    <!-- Radar Sweep Beam -->
    <line x1="110" y1="110" x2="190" y2="110" stroke="url(#goldGrad)" stroke-width="3" class="radar-line" filter="url(#glowGold)"/>
    <!-- Equipment Blips -->
    <circle cx="145" cy="80" r="4" fill="#10b981"/>
    <circle cx="80" cy="150" r="5" fill="#f59e0b"/>
    <circle cx="160" cy="140" r="4" fill="#3b82f6"/>
  </g>

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)"/>

  <!-- FOREGROUND LAYER: Text & Cards (Guaranteed Crisp & Unobscured) -->
  
  <!-- Category Pill Badge -->
  <g class="floating-card" transform="translate(60, 48)">
    <rect width="280" height="32" rx="16" fill="url(#goldGrad)"/>
    <text x="140" y="21" text-anchor="middle" class="badge-text">🏗️ HEAVY EQUIPMENT TELEMATICS</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" class="title">Awesome Construction Equipment</text>
  <text x="60" y="180" class="title" fill="#f59e0b">Fleet Management Ecosystem</text>

  <!-- Subtitle -->
  <text x="60" y="224" class="subtitle">Curated SaaS Platforms, IoT Telematics, Diagnostics &amp; Open-Source Projects</text>

  <!-- Feature Highlights / Pills Row -->
  <g transform="translate(60, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">📡 GPS &amp; CAN Bus</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="280" y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">🛠️ Work Orders &amp; PM</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">📊 Jobsite Utilization</text>

    <!-- Pill 4 -->
    <rect x="585" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="670" y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">⚡ Open-Source Stack</text>
  </g>

  <!-- Decorative Bottom Line -->
  <line x1="60" y1="324" x2="1140" y2="324" stroke="#334155" stroke-width="1"/>
</svg>
